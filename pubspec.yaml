name: riwaya
description: رواية — كتابة ونشر الروايات
publish_to: 'none'
version: 1.16.0+116

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.0.0
  shared_preferences: ^2.3.2
  photo_manager: ^3.3.0
  video_player: ^2.9.2
  pdf: ^3.11.1
  printing: ^5.13.2
  http: ^1.2.2
  path_provider: ^2.1.4
  crypto: ^3.0.5
  uuid: ^4.5.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFE3EE"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
