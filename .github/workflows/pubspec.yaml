name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: أيقونة وردية بشكل كتاب
        run: |
          sudo apt-get update -qq && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert -size 1024x1024 xc:'#FFE3EE' \
            -fill '#E91E63' -draw "roundrectangle 230,170 780,860 46,46" \
            -fill '#AD1457' -draw "roundrectangle 230,170 330,860 34,34" \
            -fill '#FFF7FA' -draw "roundrectangle 370,240 730,790 22,22" \
            -fill '#F48FB1' \
            -draw "rectangle 420,330 690,352" \
            -draw "rectangle 420,420 690,442" \
            -draw "rectangle 420,510 690,532" \
            -draw "rectangle 420,600 640,622" \
            -fill '#E91E63' -draw "roundrectangle 470,690 700,730 18,18" \
            assets/icon.png

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ino-apk
          path: build/app/outputs/flutter-apk/app-release.apk
